[project]
name = "cropmath-toolkit"
version = "0.0.0"
description = "Validation and scoring environment for CropMath"
requires-python = ">=3.12,<3.13"
dependencies = ["datasets==5.0.1"]

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
